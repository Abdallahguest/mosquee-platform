services:
  postgres:
    image: postgres:16
    container_name: mosquee-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mosquee_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mosquee_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pg_test_data:/var/lib/postgresql/data

volumes:
  pg_test_data:
